[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cfhm"
version = "0.2.0"
description = "CFHM negative-result research artifact"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.1",
  "pandas==3.0.5",
  "scipy==1.18.0",
  "torch==2.13.0",
]
license = { file = "LICENSE" }
authors = [{ name = "Ox-alpha / Manus execution layer" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
